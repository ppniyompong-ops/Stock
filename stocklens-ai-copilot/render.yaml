services:
  - type: web
    name: stocklens-ai
    runtime: node
    plan: free
    buildCommand: npm install --no-save extract-zip && node -e "require('extract-zip')('stocklens-ai-copilot-updated.zip',{dir:process.cwd()})" && npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FINNHUB_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MARKET_SYMBOLS
        value: SPY,QQQ,AAPL,MSFT,NVDA,GOOGL,AMZN,META
  - type: cron
    name: stocklens-market-pulse
    runtime: node
    buildCommand: npm install --no-save extract-zip && node -e "require('extract-zip')('stocklens-ai-copilot-updated.zip',{dir:process.cwd()})" && npm install
    startCommand: npm run cron:market-pulse
    schedule: "30 1 * * 1-5"
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FINNHUB_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MARKET_SYMBOLS
        value: SPY,QQQ,AAPL,MSFT,NVDA,GOOGL,AMZN,META
