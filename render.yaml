services:
  - type: web
    name: stocklens-ai
    runtime: node
    rootDir: stocklens-ai-copilot
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FINNHUB_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.8-flash
      - key: MARKET_SYMBOLS
        value: SPY,QQQ,AAPL,MSFT,NVDA,GOOGL,AMZN,META
  - type: cron
    name: stocklens-market-pulse
    runtime: node
    rootDir: stocklens-ai-copilot
    buildCommand: npm install
    startCommand: npm run cron:market-pulse
    schedule: "0 22 * * 1-5"
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FINNHUB_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.8-flash
      - key: MARKET_SYMBOLS
        value: SPY,QQQ,AAPL,MSFT,NVDA,GOOGL,AMZN,META
